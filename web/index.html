<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Minha Biblioteca: coleção pessoal de livros. Cadastre, avalie e acompanhe suas leituras.">
  <meta name="theme-color" content="#0B0D12">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Minha Biblioteca">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Minha Biblioteca</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #0B0D12; }
    /* Tela de carregamento enquanto o Flutter inicia. */
    #carregando {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #0B0D12; color: #ECEFF4;
      font: 600 22px/1 system-ui, sans-serif; letter-spacing: .04em;
      transition: opacity .3s;
    }
    #carregando .marca {
      width: 64px; height: 64px; border-radius: 18px; background: #B6FF3C;
      display: grid; place-items: center;
      animation: pulso 1.1s ease-in-out infinite alternate;
    }
    @keyframes pulso { from { transform: scale(.92); } to { transform: scale(1.05); } }
    @media (prefers-reduced-motion: reduce) { #carregando .marca { animation: none; } }
  </style>
</head>
<body>
  <div id="carregando" role="status" aria-live="polite">
    <div class="marca">
      <svg width="38" height="38" viewBox="0 0 38 38" aria-hidden="true">
        <path d="M8 20 L16 28 L31 11" fill="none" stroke="#0B0D12" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    Minha Biblioteca
  </div>
  <script>
    // Some com a tela de carregamento quando o primeiro quadro do Flutter aparece.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('carregando');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 350);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
